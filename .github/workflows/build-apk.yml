name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check Groq key
        run: |
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then echo "::warning::GROQ_API_KEY secret is not set — Ask Hujur will not work in this APK"; fi

      - name: Build web app
        env:
          CAPACITOR: 'true'
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk IslamicApp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-apk
          path: IslamicApp.apk
