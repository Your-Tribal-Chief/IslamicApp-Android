name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check Groq key
        run: |
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then echo "::warning::GROQ_API_KEY secret is not set — Ask Hujur will not work in this APK"; fi

      - name: Build web app
        env:
          CAPACITOR: 'true'
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk IslamicApp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-apk
          path: IslamicApp.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep versionName android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" IslamicApp.apk --title "Islamic App $VERSION (build ${{ github.run_number }})" --notes "Android APK — ${{ github.event.head_commit.message || 'manual build' }}" --latest

      - name: Push APK to apk branch
        run: |
          mkdir out && cp IslamicApp.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add IslamicApp.apk && git commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
